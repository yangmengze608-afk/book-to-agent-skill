# Eval cases for the-decision-notebook skill.
# Counts meet the V1 minimum: 5 positive_trigger, 5 negative_trigger,
# 5 application, 3 edge_case.

- id: trigger-001
  type: positive_trigger
  prompt: >
    我连续三次投资都赚钱了，是不是说明我的判断方法已经得到验证？
  expected:
    - distinguish outcome quality from decision quality (no resulting)
    - point out the small sample size and what it can/cannot prove
    - reason probabilistically instead of issuing a verdict
  must_avoid:
    - concluding "you are validated" or "you are just lucky"
- id: trigger-002
  type: positive_trigger
  prompt: >
    I have two job offers and I'm torn. One pays more, the other is a better
    team. How should I decide?
  expected:
    - frame the choice as a bet (belief + stake + odds)
    - ask for or attach confidence numbers to load-bearing beliefs
    - name the rejected alternative and why
- id: trigger-003
  type: positive_trigger
  prompt: >
    Our CEO says we should double down on this failing project because we've
    already spent two years on it. Is that a good argument?
  expected:
    - identify escalation of commitment / sunk-cost escalation
    - recommend pre-written tripwires or write them now
- id: trigger-004
  type: positive_trigger
  prompt: >
    Help me set up a way to stop lying to myself about whether my past
    decisions were actually good.
  expected:
    - propose the decision journal with its five fields
    - insist entries are written before outcomes are known
    - set a monthly review cadence
- id: trigger-005
  type: positive_trigger
  prompt: >
    We're about to commit to a big migration. How do we make sure we're not
    walking into an obvious disaster?
  expected:
    - run a premortem (imagine the failure already happened, past tense)
    - convert failure modes into tripwires with condition + date + action
- id: anti-001
  type: negative_trigger
  prompt: >
    Can you summarize the plot of Pride and Prejudice for my book club?
  expected:
    - answer as a normal literary summary without decision framing
  must_avoid:
    - framing Elizabeth's choices as bets with confidence numbers
    - invoking decision journals or premortems
- id: anti-002
  type: negative_trigger
  prompt: >
    Fix the off-by-one error in this Python for loop.
  expected:
    - just fix the code
  must_avoid:
    - treating the bug fix as a significant decision under uncertainty
    - running the bet-sizing or journal ceremony on a trivial task
- id: anti-003
  type: negative_trigger
  prompt: >
    What's the difference between TCP and UDP?
  expected:
    - give a factual networking explanation
  must_avoid:
    - reinterpreting a knowledge question as a decision to be journaled
- id: anti-004
  type: negative_trigger
  prompt: >
    I have chest pain when I exercise. What should I do?
  expected:
    - recommend seeing a doctor promptly; do not structure it as a bet
  must_avoid:
    - sizing the "bet" on medical outcomes or assigning confidence numbers
    - replacing licensed medical judgment with decision-process framing
- id: anti-005
  type: negative_trigger
  prompt: >
    Write a limerick about my cat.
  expected:
    - write the limerick
  must_avoid:
    - asking the user to state what they are betting on regarding the cat
- id: application-001
  type: application
  prompt: >
    Our startup must choose between raising a priced round now or running
    profitable for another year. Walk me through the decision.
  expected:
    - state the decision as an explicit bet with named beliefs
    - number the confidences and date them
    - check survivability of the worst realistic case before sizing
    - end with at least two tripwires (condition + date + action)
- id: application-002
  type: application
  prompt: >
    Last quarter we fired fast on a hire and it worked out badly. My
    co-founder says we should slow down all hiring. Evaluate that
    conclusion.
  expected:
    - score the decision process separately from the bad outcome
    - check whether one outcome proves anything (sample size)
    - extract a specific rule rather than a general mood shift
- id: application-003
  type: application
  prompt: >
    My team's sprint estimates are always optimistic. How do I fix this
    using calibration?
  expected:
    - have estimates recorded as numbers before outcomes are known
    - score calibration over time (claimed 80% events ~80% right)
    - "update proportionally: late deliveries teach, on-time ones barely do"
- id: application-004
  type: application
  prompt: >
    Design the agenda for a 60-minute meeting that must pick one of three
    roadmap options.
  expected:
    - private estimates collected before discussion, revealed at once
    - a rotating dissent slot before closure
    - an explicitly declared convergence state at the end
- id: application-005
  type: application
  prompt: >
    I'm 60% confident our competitor ships their feature in Q2. They just
    announced a hiring freeze. Should I move to 90%?
  expected:
    - ask whether the hiring freeze was already priced into the 60%
    - move the number in proportion to how surprising the news actually is
    - keep the confidence dated and numerical
- id: edge-001
  type: edge_case
  prompt: >
    I can only make this decision once in my life - selling the family
    business. Does journaling still help?
  expected:
    - acknowledge the slow/one-off feedback loop limitation (L1, L2)
    - lean on base rates and external counsel instead of personal calibration
    - still structure the decision, but without pretending calibration data will accumulate
- id: edge-002
  type: edge_case
  prompt: >
    We did everything right - perfect process, great journal entry - and
    still lost the client. Was the decision bad?
  expected:
    - separate decision quality from outcome quality explicitly
    - "classify as good decision + bad outcome: review information, not process"
    - resist retroactively condemning the process because the die landed badly
- id: edge-003
  type: edge_case
  prompt: >
    My boss wants to see our decision journal, and I'm worried mistakes in
    it will be used against us in reviews.
  expected:
    - "name the blame-culture failure mode (L3): journals die when punished"
    - propose safeguards (aggregated lessons, anonymized entries, or opted-out framing)
    - refuse to present the journal as a blame record; it is a calibration instrument
