rationale: >-
  The book's eight chapters all teach one capability: making and reviewing
  decisions under uncertainty. Chapter titles name the core moves - "Every
  Decision Is a Bet", "Resulting", belief updating/calibration, decision
  journaling, bet sizing, premortems and tripwires, group dissent. The
  method is probabilistic decision quality (belief/confidence numbers,
  outcome vs. process separation), which is squarely the decision-making
  profile. psychology-behavior is a mild alternative because Chapter 2
  discusses outcome bias as a cognitive trap, but the book teaches a
  decision procedure, not theories of mind.
