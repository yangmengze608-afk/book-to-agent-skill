# Book Taxonomy V1
#
# One book gets exactly ONE primary category. Categories drive which
# distillation profile is used (see taxonomy/distillation_profiles/).
# Keep this list flat and extendable; do not build a deep ontology.

categories:
  - id: decision-making
    label: Decision Making
    description: >-
      Books that teach how to decide, judge, forecast, and reason under
      uncertainty.
    subcategories: [uncertainty, risk, judgment, forecasting, group-decisions, general]
    keywords: [decision, decide, betting, bets, odds, probability, uncertainty,
               expected value, outcome bias, resulting, sunk cost, trade-off,
               tradeoff, judgment, choice architecture, risk, forecast,
               calibration, decision journal, decision quality]

  - id: investing-finance
    label: Investing & Finance
    description: >-
      Books about investing, markets, valuation, trading, and capital
      allocation.
    subcategories: [value-investing, trading, personal-finance, corporate-finance, macro]
    keywords: [investment, investing, investor, stock market, stocks, portfolio,
               valuation, intrinsic value, cash flow, margin of safety, risk,
               asset allocation, bonds, options, trading, capital, compounding,
               balance sheet, moat, diversification, fund, finance, financial]

  - id: business-strategy
    label: Business & Strategy
    description: >-
      Books on competitive strategy, business models, growth, innovation,
      and entrepreneurship.
    subcategories: [competitive-strategy, innovation, growth, entrepreneurship, business-models]
    keywords: [strategy, competitive advantage, disruption, disruptive, market,
               business model, customer, growth, moat, positioning, innovation,
               startup, founder, industry, profit, brand, pricing, enterprise,
               company, companies]

  - id: psychology-behavior
    label: Psychology & Behavior
    description: >-
      Books explaining mind and behavior: cognitive biases, motivation,
      social psychology, behavior change.
    subcategories: [cognitive-biases, motivation, social-psychology, behavior-change, popular-psychology]
    keywords: [psychology, psychological, bias, biases, cognitive, behavior,
               behaviour, behavioral, motivation, habit, emotion, persuasion,
               unconscious, mindset, reward, dopamine, anxiety, perception,
               memory, social proof, nudge, willpower, procrastination]

  - id: research-science
    label: Research & Science
    description: >-
      Books on scientific method, experimental design, statistics, and how
      reliable knowledge is produced.
    subcategories: [scientific-method, statistics, field-surveys, nature-of-science]
    keywords: [research, experiment, experimental, hypothesis, evidence, study,
               data, statistics, statistical, correlation, causation, causal,
               sample, placebo, peer review, theory, measurement, replication,
               validity, confound, regression, significance, science, scientist]

  - id: learning-education
    label: Learning & Education
    description: >-
      Books about how people learn, practice, and build expertise.
    subcategories: [learning-skills, deliberate-practice, teaching, expertise, memory]
    keywords: [learning, learn, practice, deliberate practice, skill acquisition,
               mastery, memory, retention, study, studying, teaching, expertise,
               expert, fluency, spaced repetition, education, curriculum,
               knowledge, transfer]

  - id: writing
    label: Writing
    description: >-
      Books on writing craft: drafting, editing, structure, style, and
      storytelling.
    subcategories: [writing-craft, editing, style, storytelling, technical-writing]
    keywords: [writing, writer, write, draft, drafting, editing, edit, revise,
               revision, prose, style, sentence, paragraph, story, storytelling,
               narrative, clarity, voice, grammar, manuscript, author]

  - id: communication-negotiation
    label: Communication & Negotiation
    description: >-
      Books on persuading, listening, negotiating, and handling difficult
      conversations.
    subcategories: [negotiation, persuasion, difficult-conversations, presentations, interpersonal]
    keywords: [negotiation, negotiate, persuasion, persuade, influence,
               conversation, dialogue, listen, listening, empathy, conflict,
               difficult conversation, bargaining, batna, anchor, interview,
               presentation, public speaking, feedback, rapport]

  - id: productivity
    label: Productivity
    description: >-
      Books on personal effectiveness: systems, habits, focus, time
      management, and workflow.
    subcategories: [systems, habits, time-management, focus, workflow]
    keywords: [productivity, habit, habits, routine, time management, focus,
               deep work, attention, procrastination, prioritize,
               prioritization, to-do, todo, workflow, efficiency, calendar,
               inbox, getting things done, gtd, system, workflow design]

  - id: leadership-management
    label: Leadership & Management
    description: >-
      Books on leading people, managing teams, culture, and organizations.
    subcategories: [leadership, management, teams, culture, hiring-talent]
    keywords: [leadership, leader, lead, manage, manager, management, team,
               teams, culture, organizational, organization, hiring, recruit,
               feedback, delegation, delegate, executive, employee, coaching,
               trust, one-on-one, talent]

  - id: technology-engineering
    label: Technology & Engineering
    description: >-
      Technical books: software, systems, algorithms, architecture, and
      engineering practice.
    subcategories: [software-engineering, system-design, programming-languages, infrastructure, hardware]
    keywords: [software, code, coding, programming, programmer, engineer,
               engineering, system, systems, architecture, algorithm,
               algorithms, design pattern, debugging, testing, refactor,
               refactoring, api, database, network, protocol, compiler,
               deployment, distributed, linux, python, javascript]

  - id: creativity-design
    label: Creativity & Design
    description: >-
      Books on creative process, design thinking, craft, and making things.
    subcategories: [creative-process, design-thinking, visual-design, art-craft]
    keywords: [creativity, creative, design, designer, idea generation,
               imagination, brainstorm, sketch, sketching, prototype,
               prototyping, aesthetics, art, craft, maker, iteration,
               inspiration, taste]

  - id: philosophy-thinking
    label: Philosophy & Thinking
    description: >-
      Books on reasoning itself: epistemology, ethics, meaning, critical
      thinking, and worldviews.
    subcategories: [epistemology, ethics, critical-thinking, meaning, traditions]
    keywords: [philosophy, philosophical, truth, knowledge, epistem, ethic,
               ethics, moral, morality, meaning, existence, reason, reasoning,
               logic, critical thinking, argument, wisdom, virtue, stoic,
               stoicism, metaphysic, enlightenment]

  - id: health-performance
    label: Health & Performance
    description: >-
      Books on body and mind performance: fitness, sleep, nutrition,
      medicine, and recovery.
    subcategories: [fitness, sleep, nutrition, medicine, peak-performance]
    keywords: [health, healthy, fitness, sleep, nutrition, diet, exercise,
               training, medicine, medical, brain, stress, longevity, energy,
               recovery, wellness, disease, strength, aerobic, hormone,
               performance]

  - id: reference-knowledge
    label: Reference & Knowledge
    description: >-
      Handbooks, encyclopedic guides, and surveys meant to be consulted,
      not read cover to cover.
    subcategories: [handbooks, encyclopedic, field-guides, surveys]
    keywords: [handbook, encyclopedia, encyclopedic, reference, dictionary,
               textbook, manual, field guide, complete guide, definitive guide,
               companion, almanac, atlas, overview, survey of]

  - id: other
    label: Other
    description: >-
      Fallback for books that fit no category yet. Distillation uses the
      base profile only.
    subcategories: [general]
    keywords: []

# Reserved tags are free-form; nothing is enforced beyond the primary
# category, subcategory, and tags fields living in BOOK.yaml.
