category: leadership-management
label: Leadership & Management

focus:
  - leadership principles (what the author claims leaders actually do)
  - management operating systems (meetings, goals, reviews, one-on-ones)
  - team design (roles, ownership, decision rights)
  - culture levers (what leaders do that shapes behavior)
  - hiring and talent judgment procedures
  - feedback and difficult conversations at work
  - delegation and escalation rules
  - failure modes (micromanagement, hero culture, mis-hires) and repairs

epistemic_guardrails:
  - Separate the author's experience-derived advice from any research evidence cited.
  - Keep normative claims labeled as AUTHOR CLAIM; not "leaders must".
  - Advice should adapt to team size and context; note where the book assumes scale.

example_trigger_questions:
  - "My two leads keep clashing. How does the book suggest I intervene?"
  - "Structure a weekly one-on-one that surfaces problems early."
  - "What should I probe in a senior hire interview?"
  - "My team says yes to everything and misses deadlines. Which failure mode is this?"
  - "How do I delegate without losing quality control?"

example_anti_trigger_questions:
  - "Draft our company's HR policy manual."
  - "Calculate this team's utilization percentage."
