category: communication-negotiation
label: Communication & Negotiation

focus:
  - objectives definition (what each conversation is really for)
  - stakeholder analysis (interests vs. positions, motivations, constraints)
  - communication frameworks (named models with steps)
  - negotiation procedures (preparation, exchange, bargaining, closing)
  - signals to read and send (what to listen for, what to reveal)
  - tactics and counter-tactics (with ethical boundaries the book draws)
  - failure modes (escalation, anchoring traps, misread silence)
  - boundaries (when to walk away; relationship vs. deal trade-offs)

epistemic_guardrails:
  - Separate the author's normative ethics from effective-but-contested tactics; keep both, labeled.
  - Examples must be paraphrased; label which side's perspective each lesson comes from.
  - The skill should role-play and coach procedures, not just describe them.

example_trigger_questions:
  - "I need to ask my landlord for a two-month rent freeze. Help me prepare."
  - "My teammate shut down during the retro. How do I reopen the conversation?"
  - "What's my BATNA in this freelance negotiation?"
  - "Rehearse a salary conversation where they anchor low."
  - "How should I deliver hard feedback to a peer?"

example_anti_trigger_questions:
  - "Write a wedding speech for my sister."  # (not a negotiation/conversation framework task)
  - "Translate this email to Japanese."
