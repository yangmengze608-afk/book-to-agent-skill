category: technology-engineering
label: Technology & Engineering

focus:
  - core concepts and definitions the book establishes
  - procedures (step-by-step techniques with preconditions and outputs)
  - architecture and design principles (trade-offs, not just patterns)
  - algorithms and data structures (complexity, applicability)
  - implementation patterns (idiomatic usage, common structures)
  - debugging procedures (how the book approaches faults systematically)
  - anti-patterns (what the book warns against, and why)
  - troubleshooting checklists

extra_reference_files:
  anti-patterns.md: Anti-patterns from the book with symptoms, causes, and remedies.

epistemic_guardrails:
  - Mark version- and platform-specific advice with its context (tools age).
  - Distinguish the book's explanations of fundamentals from its opinionated practices.
  - Code snippets in examples.md must be original illustrative snippets, not copied from the book.

skill_sections_extra:
  - How to Debug With This Skill

example_trigger_questions:
  - "Why might this async loop deadlock, and how do I reason about it?"
  - "Which data structure fits this access pattern, per the book?"
  - "Review my design for the trade-offs the book cares about."
  - "Give me a systematic debugging procedure for this flaky test."
  - "What's the idiomatic way to structure this module?"

example_anti_trigger_questions:
  - "Write a CSS animation for a hamburger menu."  # (not the book's domain)
  - "What is the latest version of Kubernetes?"
