category: productivity
label: Productivity

focus:
  - systems principles (how the author thinks about work as a system)
  - habit design (cue/routine/reward style loops the book proposes)
  - prioritization rules (what to do first, what to drop)
  - focus and attention management (interruptions, context switching, deep work blocks)
  - time management procedures (calendar, batching, reviews)
  - workflow tooling philosophy (lists, boards, inboxes - conceptually, not brand-specific)
  - review loops (daily / weekly / quarterly cadences)
  - failure modes (productivity theater, over-optimization, burnout signals)

epistemic_guardrails:
  - Keep advice actionable and bounded; avoid turning the skill into a life-coaching oracle.
  - Distinguish mechanisms (why it works, per the author) from instructions (what to do).
  - Mark where advice conflicts with common research findings, if the book itself does.

example_trigger_questions:
  - "My task list has 200 items. How does the book say to triage?"
  - "Design a weekly review ritual I can actually keep."
  - "I context-switch all day. What does the book prescribe?"
  - "Turn my vague goal into a working system."
  - "I keep breaking my habit streak after ten days. What's the fix?"

example_anti_trigger_questions:
  - "Order my groceries."  # (not a method question)
  - "Which calendar app should I buy?"
