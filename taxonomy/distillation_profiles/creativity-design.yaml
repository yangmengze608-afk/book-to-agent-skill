category: creativity-design
label: Creativity & Design

focus:
  - creative process principles (how ideas are generated and shaped, per the book)
  - ideation procedures (divergence and convergence techniques)
  - design principles (contrast, hierarchy, constraint, simplicity - as the book frames them)
  - critique procedures (how to give and receive design feedback)
  - iteration and prototyping loops
  - taste development (how the author says judgment is built)
  - working with constraints (briefs, materials, budgets)
  - creative blocks and remedies

epistemic_guardrails:
  - Creativity advice is largely prescriptive craft knowledge; label as AUTHOR CLAIM unless the book cites evidence.
  - Do not turn the book's aesthetic judgments into universal rules.
  - The skill should run ideation/critique procedures, not just praise ideas.

example_trigger_questions:
  - "Run an ideation session for naming this product."
  - "Critique this landing page layout using the book's principles."
  - "I'm stuck on chapter three. What does the book do about blocks?"
  - "Generate 20 variations under a one-day deadline constraint."
  - "How do I build taste in typography?"

example_anti_trigger_questions:
  - "Generate an image of a sunset."  # (generation, not method)
  - "What font did this famous logo use?"
