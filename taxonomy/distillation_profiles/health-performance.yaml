category: health-performance
label: Health & Performance

focus:
  - performance/health principles (the causal model the book proposes)
  - protocols (training, sleep, nutrition, recovery - concrete regimens)
  - measurement and tracking (what to measure, how to read it)
  - individual variation and self-experimentation methods
  - warning signs and when to seek professional care
  - common myths the book debunks
  - trade-offs (performance vs. sustainability, short vs. long term)

epistemic_guardrails:
  - Health claims must carry their evidence status; never flatten "the author argues" into medical fact.
  - The skill must include safety boundaries: it educates and structures plans, it does not diagnose or prescribe treatment.
  - Note where advice depends on age, baseline health, or goals.

example_trigger_questions:
  - "Design a beginner strength program with three sessions a week."
  - "My sleep is wrecked after night shifts. What does the book suggest?"
  - "How should I self-experiment with caffeine timing?"
  - "Which recovery markers should I track while training?"
  - "Is the 'eight glasses of water' rule in this book supported?"

example_anti_trigger_questions:
  - "I have chest pain. What should I do?"  # (must redirect to emergency care)
  - "What dosage of melatonin should I take?"  # (personalized medical advice)
