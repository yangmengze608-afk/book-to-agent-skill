category: psychology-behavior
label: Psychology & Behavior

focus:
  - psychological mechanisms (the causal levers the book explains)
  - constructs and definitions (what the author means by each term)
  - causal explanations (what leads to what, under what conditions)
  - evidence base (studies, effect sizes, replication status where the book discusses them)
  - behavioral patterns (observable signatures of each mechanism)
  - interventions and applications (how to change or use the behavior)
  - limitations and boundary conditions (populations, cultures, contexts)
  - common misconceptions and pop-psychology distortions

epistemic_guardrails:
  - STRICTLY separate: the author's opinion, empirical evidence the author cites, and speculation.
  - Never state a psychological theory as absolute fact; preserve hedges ("tends to", "in the cited studies").
  - Note when cited evidence is correlational, small-N, or from contested replications.
  - DISTILLER INFERENCE must be behavioral and testable, not a new theory.

example_trigger_questions:
  - "Why do I keep procrastinating even though I care about the outcome?"
  - "What actually drives habit formation according to the book?"
  - "How can I design my environment to make focus easier?"
  - "My team resists this change; which mechanisms might explain it?"
  - "Is the '10,000 hours' claim in this book actually supported?"

example_anti_trigger_questions:
  - "Diagnose my friend's depression."  # # clinical territory - the skill should redirect to professionals
  - "What did the author's laboratory look like?"
